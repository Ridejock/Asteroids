# Builds, tests and packages ROCK BLASTER and ROCK BLASTER ROGUE on every push
# to main and on pull requests, using Emerald's reusable game workflow. A tag
# (v1.2.1) also attaches the archives to the GitHub release and publishes them
# to itch.io with butler. The version is CMake's project(VERSION). An empty
# BUTLER_API_KEY skips the itch upload and leaves the run green.
#
# itch.io (https://ridejock.itch.io): each archive is routed by the longest
# matching name, so RockBlasterRogue is listed before RockBlaster.
#   RockBlaster-*-windows-x64.zip       -> ridejock/rock-blaster:windows
#   RockBlaster-*-linux-x64.zip         -> ridejock/rock-blaster:linux
#   RockBlasterRogue-*-windows-x64.zip  -> ridejock/rock-blaster-rogue:windows
#   RockBlasterRogue-*-linux-x64.zip    -> ridejock/rock-blaster-rogue:linux
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The caller's group. game.yml uses emerald-game-${{ github.workflow }}-${{ github.ref }}
# so this does not deadlock with the called workflow. tools/ci is checked out
# from Emerald; this repo does not copy those scripts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    uses: Ridejock/Emerald/.github/workflows/game.yml@main
    with:
      presets: release
      platforms: windows,linux
      package-preset: release
      cmake-target: package
      itch-user: ridejock
      itch-games: |
        RockBlasterRogue rock-blaster-rogue
        RockBlaster rock-blaster
    secrets:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

  # The previous release workflow attached the zips to the GitHub release of
  # the tag. The reusable workflow still uploads them as artifacts; this job
  # publishes those artifacts. itch.io is a separate step inside `game` and
  # skips when BUTLER_API_KEY is unset.
  github-release:
    needs: game
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Require an archive
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::The package job uploaded no .zip or .tar.gz"
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          fail_on_unmatched_files: false
